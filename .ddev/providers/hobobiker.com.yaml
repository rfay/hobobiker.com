#ddev-silent-no-warn

# This will pull a database and files from a network location, for example,
# server or other jumphost. It operates inside the web container and uses
# ssh, so you need to `ddev auth ssh` first.

# To use this configuration,
#
# 1. You need a database dump and/or user-generated files tarball that you
#    have access to somewhere on the internet
# 2. Copy hobobiker.com.yaml.example to hobobiker.com.yaml (or name it as you see fit)
# 3. `ddev auth ssh` (only needs to be done once per ddev session or reboot)
# 4. Use `ddev pull rsync` to pull the project database and files.
# 5. `ddev push rsync` can push the project database and files

# Note that while this is done in the web container (because rsync will always be there)
# it could also be done on the host, and then you wouldn't need the
# `ddev auth ssh`

environment_variables:
  dbbase: rfay@ddevprod.thefays.us:/home/rfay/workspace/hobobiker.com/.ddev/db_snapshots/
  filesurl: rfay@ddevprod.thefays.us:/home/rfay/workspace/hobobiker.com/docroot/sites/default/files

auth_command:
  command: |
    set -eu -o pipefail
    ssh-add -l >/dev/null || ( echo "Please 'ddev auth ssh' before running this command." && exit 1 )

db_import_command:
  command: |
    set -x   # You can enable bash debugging output by uncommenting
    set -eu -o pipefail
    hostname
    fname=$(ssh rfay@ddevprod.thefays.us "cd workspace/hobobiker.com/.ddev/db_snapshots; ls -t | head -1l")
    rsync -avz "${dbbase}/${fname}" ${DDEV_APPROOT}/.ddev/db_snapshots/latest-mariadb_10.2.zst
    ddev snapshot restore --latest
  service: host

files_pull_command:
  command: |
    # set -x   # You can enable bash debugging output by uncommenting
    set -eu -o pipefail
    pushd /var/www/html/.ddev/.downloads >/dev/null
    rsync -avz "${filesurl}" .
  service: web

